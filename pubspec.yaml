name: gpt_markdown
description: "Powerful Flutter Markdown & LaTeX Renderer: Rich Text, Math, Tables, Links, and Text Selection. Ideal for ChatGPT, Gemini, and more."
version: 1.2.1
homepage: https://gptmarkdown.com
repository: https://github.com/Infinitix-LLC/gpt_markdown
issue_tracker: https://github.com/Infinitix-LLC/gpt_markdown/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  # RadioGroup, used by the radio list marker, was added in 3.32.
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  http: ^1.2.0

  # Gen-UI widget dependencies. Git refs are LOCAL DEVELOPMENT ONLY — pub.dev
  # rejects git dependencies, so these must be dropped (or the widgets split
  # into a companion package) before this package can be published again.
  plot_latex:
    git:
      url: git@github.com:Infinitix-LLC/plot_latex.git
      ref: main
  val_3d:
    git:
      url: git@github.com:Infinitix-LLC/val_3d.git
      ref: main
  plusfinity_calculator:
    git:
      url: git@github.com:Infinitix-LLC/plusfinity_calculator.git
      ref: main
  vector_math: ^2.1.4
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: lib/fonts/JetBrainsMono-Regular.ttf

topics:
  - markdown
  - latex
  - selectable
  - chatgpt
  - gemini

