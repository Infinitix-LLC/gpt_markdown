name: gpt_markdown
description: "Powerful Flutter Markdown & LaTeX Renderer: Rich Text, Math, Tables, Links, and Text Selection. Ideal for ChatGPT, Gemini, and more."
version: 1.2.1
homepage: https://gptmarkdown.com
repository: https://github.com/Infinitix-LLC/gpt_markdown
issue_tracker: https://github.com/Infinitix-LLC/gpt_markdown/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  # RadioGroup, used by the radio list marker, was added in 3.32.
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: lib/fonts/JetBrainsMono-Regular.ttf

topics:
  - markdown
  - latex
  - selectable
  - chatgpt
  - gemini
